name: Сборка APK Клуба ILY

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.7' }
      - name: Собираем APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Готовим файл
        run: cp app/build/outputs/apk/debug/app-debug.apk ILY-Messenger.apk
      - uses: actions/upload-artifact@v4
        with: { name: ILY-Messenger, path: ILY-Messenger.apk }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.${{ github.run_number }}
          name: Клуб ILY 3.0.${{ github.run_number }} — автономное приложение
          body: |
            Автономное приложение клуба: интерфейс внутри APK, работа без браузера и без SSL.
            Книга контактов, звонки, уведомления и счётчик на иконке — нативные.
            Скачайте ILY-Messenger.apk на телефон и откройте файл.
          files: ILY-Messenger.apk
